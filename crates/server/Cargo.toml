[package]
name = "bitrev_server"
version = "0.1.0"
edition = "2021"
description = "HTTP daemon for bitrev"
license = "Apache-2.0"

[lib]
name = "server"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
axum = "0.8"
bit_rev.workspace = true
rand.workspace = true
serde.workspace = true
serde_json = "1"
serde_urlencoded = "0.7"
tokio.workspace = true
toml.workspace = true
tower-http = { version = "0.6", features = ["trace"] }
tracing.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.10"
tower = { version = "0.5", features = ["util"] }
